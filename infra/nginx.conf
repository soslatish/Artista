# В логах — путь без query string: в /api/v1/ws?token=... передаётся access-токен
log_format artista '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

server {
    listen 80;
    access_log /var/log/nginx/access.log artista;
    client_max_body_size 12m;

    # API доверяет X-Real-IP (TRUST_PROXY_HEADERS=true), поэтому nginx всегда перезаписывает его.
    # Если перед nginx стоит балансировщик хостинга, добавьте:
    #   set_real_ip_from <CIDR балансировщика>; real_ip_header X-Forwarded-For;
    location / {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 75s;
    }

    location /api/v1/ws {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }
}
